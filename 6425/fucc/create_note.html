<!DOCTYPE html>

<body>
    <div class="center">
        <h1>Create a Note</h1>
        <form action="save_note.php" method="POST">
            <label for="note_title">Title:</label><br>
            <input type="text" id="note_title" name="note_title" required><br><br>
            <label for="note_content">Content:</label><br>
            <textarea id="note_content" name="note_content" rows="10" cols="30" required></textarea><br><br>
            <button type="submit">Save Note</button>
        </form>
    </div>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        .center {
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
        <script>

             document.getElementById('note_form').onsubmit = function() {

                 return true; // Allow form submission
             };

        </script>   
    </div>
    <div class="notes-list">
        <h2>Your Notes</h2>
