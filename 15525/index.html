<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Cực Đẹp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 400px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #5a67d8;
    }
  </style>
  <script>
    function troll() {
      window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    }
    function site(){
        window.location.href="https://quocbaolinux-beta.github.io/homepage";
    }
  </script>
</head>
<body>
  <div class="card">
    <h1>Chào mừng!</h1>
    <p>Bấm nút để biết thêm chi tiết =)</p>
    <p>Bạn có chắc là đã vào được trang chủ?</p>
    <p>Nếu không chắc thì bạn có thể bấm nút này (không dính virus)</p>
    <p><strong>LƯU Ý: </strong>Một trong hai nút sẽ dẫn bạn đến trang chủ thật.</p>
    <button onclick="troll()">Bấm đi :)</button>
    <button onclick="site()">Bấm đi :)</button>
  </div>
</body>
</html>
